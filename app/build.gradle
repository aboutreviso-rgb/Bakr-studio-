plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bakr.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.bakr.studio"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signé avec la clé de debug pour pouvoir l'installer directement sur le téléphone
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
