name: Build plugins VST3 (Windows)
on:
  push:
    paths: ['plugins/**', 'installer/**', '.github/workflows/build-plugins.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler BAKR VOXMIDI
        run: |
          cmake -S plugins/BAKR_VOXMIDI -B build_vox -A x64
          cmake --build build_vox --config Release
      - name: Compiler BAKR REPAIR
        run: |
          cmake -S plugins/BAKR_REPAIR -B build_rep -A x64 -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build_vox/_deps"
          cmake --build build_rep --config Release
      - name: Compiler BAKR 81
        run: |
          cmake -S plugins/BAKR_81 -B build_81 -A x64 -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build_vox/_deps"
          cmake --build build_81 --config Release
      - name: Compiler HA-81A Coulibaly Edition
        run: |
          cmake -S plugins/HA81A_Coulibaly_Edition -B build_ha -A x64
          cmake --build build_ha --config Release --target HA81A_Coulibaly_Edition_VST3
      - name: Compiler BAKR TUBECOMP
        run: |
          cmake -S plugins/BAKR_TUBECOMP -B build_tc -A x64 -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build_vox/_deps"
          cmake --build build_tc --config Release --target BAKR_TUBECOMP_VST3
      - name: Compiler BAKR INFLATE
        run: |
          cmake -S plugins/BAKR_INFLATE -B build_inf -A x64 -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build_vox/_deps"
          cmake --build build_inf --config Release --target BAKR_INFLATE_VST3
      - name: Compiler BAKR GUITAR
        run: |
          cmake -S plugins/BAKR_GUITAR -B build_gtr -A x64 -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build_vox/_deps"
          cmake --build build_gtr --config Release --target BAKR_GUITAR_VST3
      - name: Paquets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg_vox, pkg_rep | Out-Null
          Copy-Item -Recurse "build_vox/BAKR_VOXMIDI_artefacts/Release/VST3/BAKR VOXMIDI.vst3" pkg_vox/
          Copy-Item plugins/BAKR_VOXMIDI/Installer.bat, plugins/BAKR_VOXMIDI/LISEZMOI.txt pkg_vox/
          Copy-Item -Recurse "build_rep/BAKR_REPAIR_artefacts/Release/VST3/BAKR REPAIR.vst3" pkg_rep/
          Copy-Item plugins/BAKR_REPAIR/Installer.bat, plugins/BAKR_REPAIR/LISEZMOI.txt pkg_rep/
          Compress-Archive -Path pkg_vox/* -DestinationPath BAKR_VOXMIDI_Windows.zip
          Compress-Archive -Path pkg_rep/* -DestinationPath BAKR_REPAIR_Windows.zip
          New-Item -ItemType Directory -Force pkg_81 | Out-Null
          Copy-Item -Recurse "build_81/BAKR_81_artefacts/Release/VST3/BAKR 81.vst3" pkg_81/
          Copy-Item plugins/BAKR_81/Installer.bat, plugins/BAKR_81/LISEZMOI.txt pkg_81/
          Compress-Archive -Path pkg_81/* -DestinationPath BAKR_81_Windows.zip
          New-Item -ItemType Directory -Force pkg_ha | Out-Null
          Copy-Item -Recurse "build_ha/HA81A_Coulibaly_Edition_artefacts/Release/VST3/HA-81A EQ - Coulibaly Edition.vst3" pkg_ha/
          Copy-Item plugins/HA81A_Coulibaly_Edition/Installer.bat, plugins/HA81A_Coulibaly_Edition/README_FR.md pkg_ha/
          Compress-Archive -Path pkg_ha/* -DestinationPath HA81A_Coulibaly_Edition_Windows.zip
          New-Item -ItemType Directory -Force pkg_tc | Out-Null
          Copy-Item -Recurse "build_tc/BAKR_TUBECOMP_artefacts/Release/VST3/BAKR TUBECOMP.vst3" pkg_tc/
          Copy-Item plugins/BAKR_TUBECOMP/Installer.bat, plugins/BAKR_TUBECOMP/LISEZMOI.txt pkg_tc/
          Compress-Archive -Path pkg_tc/* -DestinationPath BAKR_TUBECOMP_Windows.zip
          New-Item -ItemType Directory -Force pkg_inf | Out-Null
          Copy-Item -Recurse "build_inf/BAKR_INFLATE_artefacts/Release/VST3/BAKR INFLATE.vst3" pkg_inf/
          Copy-Item plugins/BAKR_INFLATE/Installer.bat, plugins/BAKR_INFLATE/LISEZMOI.txt pkg_inf/
          Compress-Archive -Path pkg_inf/* -DestinationPath BAKR_INFLATE_Windows.zip
          New-Item -ItemType Directory -Force pkg_gtr | Out-Null
          Copy-Item -Recurse "build_gtr/BAKR_GUITAR_artefacts/Release/VST3/BAKR GUITAR.vst3" pkg_gtr/
          Copy-Item plugins/BAKR_GUITAR/Installer.bat, plugins/BAKR_GUITAR/LISEZMOI.txt pkg_gtr/
          Compress-Archive -Path pkg_gtr/* -DestinationPath BAKR_GUITAR_Windows.zip
      - name: BAKR Suite (installateur unique)
        shell: pwsh
        env:
          SUITE_VERSION: 1.${{ github.run_number }}
        run: |
          New-Item -ItemType Directory -Force pkg_suite/VST3, pkg_suite/Notices | Out-Null
          $items = @(
            @{ vst = "build_vox/BAKR_VOXMIDI_artefacts/Release/VST3/BAKR VOXMIDI.vst3"; doc = "plugins/BAKR_VOXMIDI/LISEZMOI.txt"; name = "BAKR VOXMIDI" },
            @{ vst = "build_rep/BAKR_REPAIR_artefacts/Release/VST3/BAKR REPAIR.vst3"; doc = "plugins/BAKR_REPAIR/LISEZMOI.txt"; name = "BAKR REPAIR" },
            @{ vst = "build_81/BAKR_81_artefacts/Release/VST3/BAKR 81.vst3"; doc = "plugins/BAKR_81/LISEZMOI.txt"; name = "BAKR 81" },
            @{ vst = "build_ha/HA81A_Coulibaly_Edition_artefacts/Release/VST3/HA-81A EQ - Coulibaly Edition.vst3"; doc = "plugins/HA81A_Coulibaly_Edition/README_FR.md"; name = "HA-81A EQ - Coulibaly Edition" },
            @{ vst = "build_tc/BAKR_TUBECOMP_artefacts/Release/VST3/BAKR TUBECOMP.vst3"; doc = "plugins/BAKR_TUBECOMP/LISEZMOI.txt"; name = "BAKR TUBECOMP" },
            @{ vst = "build_inf/BAKR_INFLATE_artefacts/Release/VST3/BAKR INFLATE.vst3"; doc = "plugins/BAKR_INFLATE/LISEZMOI.txt"; name = "BAKR INFLATE" },
            @{ vst = "build_gtr/BAKR_GUITAR_artefacts/Release/VST3/BAKR GUITAR.vst3"; doc = "plugins/BAKR_GUITAR/LISEZMOI.txt"; name = "BAKR GUITAR" }
          )
          foreach ($it in $items) {
            Copy-Item -Recurse $it.vst pkg_suite/VST3/
            $ext = [System.IO.Path]::GetExtension($it.doc)
            Copy-Item $it.doc ("pkg_suite/Notices/" + $it.name + $ext)
          }
          Copy-Item installer/Installer_BAKR_Suite.bat, installer/Desinstaller_BAKR_Suite.bat, installer/LISEZMOI_BAKR_Suite.txt pkg_suite/
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer/BAKR_Suite.iss
          if ($LASTEXITCODE -ne 0) { throw "Echec Inno Setup" }
          Copy-Item BAKR_Suite_Setup.exe pkg_suite/
          Compress-Archive -Path pkg_suite/* -DestinationPath BAKR_Suite_Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins-v1.${{ github.run_number }}
          name: Plugins BAKR (Windows VST3) v1.${{ github.run_number }}
          body: "Tout en un : BAKR_Suite_Setup.exe (ou BAKR_Suite_Windows.zip puis Installer_BAKR_Suite.bat). Ensuite FL Studio > Options > Manage plugins > Find installed plugins."
          files: |
            BAKR_VOXMIDI_Windows.zip
            BAKR_REPAIR_Windows.zip
            BAKR_81_Windows.zip
            HA81A_Coulibaly_Edition_Windows.zip
            BAKR_TUBECOMP_Windows.zip
            BAKR_INFLATE_Windows.zip
            BAKR_GUITAR_Windows.zip
            BAKR_Suite_Setup.exe
            BAKR_Suite_Windows.zip
          make_latest: false
