name: Build APK BAKR Studio
on:
  push:
    paths-ignore: ['plugins/**', '.github/workflows/build-plugins.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler l'APK
        run: gradle assembleRelease
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk BAKR_Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BAKR_Studio_APK
          path: BAKR_Studio.apk
      - name: Publier dans les Releases (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: BAKR Studio Pro v2.0.${{ github.run_number }}
          body: "Télécharge BAKR_Studio.apk ci-dessous et ouvre-le sur ton téléphone Android."
          files: BAKR_Studio.apk
          make_latest: true
